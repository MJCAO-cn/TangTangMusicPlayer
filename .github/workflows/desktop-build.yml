name: TangTang Desktop Build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/tangtang-rebrand

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test

  desktop:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows x64
            os: windows-latest
            command: npm run build:win
          - target: macOS Intel
            os: macos-latest
            command: npm run build:mac:x64
          - target: macOS Apple Silicon
            os: macos-latest
            command: npm run build:mac:arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build desktop installer
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tangtang-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
